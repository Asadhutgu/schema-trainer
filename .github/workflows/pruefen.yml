# Prüft bei jeder Änderung automatisch die Schema-Dateien.
name: Schemata prüfen
on:
  push:
  pull_request:
jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/pruefen.mjs
